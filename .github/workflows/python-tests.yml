name: python-tests

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:        # manual "Run workflow" button (enables the heavy job)

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - uses: pre-commit/action@v3.0.1

  test:
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[full,test]

    - name: Test with pytest
      # Heavy `real_checkpoints` tests are excluded automatically by the
      # `-m 'not real_checkpoints'` default in pyproject's addopts. No token,
      # no network downloads here. The dedicated `foundation` job runs them.
      run: |
        pytest tests/ --cov=coco_pipe/ --cov-report=xml --verbose -s

    - name: Upload coverage reports to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: BabaSanfour/coco-pipe

  foundation:
    needs: quality
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[full,test]
    - name: Run heavy foundation tests
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        COCO_PIPE_RUN_REAL_FOUNDATION: "1"
      run: |
        pytest tests/ -m real_checkpoints -v

  docs:
    needs: quality
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
    - name: Install dependencies
      run: |
        pip install -e .[docs,full]
        # Install pandoc for some sphinx extensions if needed
        sudo apt-get install -y pandoc
    - name: Build docs
      run: |
        cd docs
        # Build docs (warnings are logged but don't fail build)
        make html
