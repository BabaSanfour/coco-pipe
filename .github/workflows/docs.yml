name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "coco_pipe/**"
      - "examples/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  # No path filter here: "Build Sphinx docs" is a required check, and a check
  # that never runs blocks the merge. The build job is skipped instead (a
  # skipped job satisfies the requirement) when the files below are untouched.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  changes:
    name: Detect docs changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.diff.outputs.docs }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Look for files the docs are built from
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          pattern='^(docs/|coco_pipe/|examples/|README\.md$|CONTRIBUTING\.md$|CHANGELOG\.md$|pyproject\.toml$|\.github/workflows/docs\.yml$)'
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -qE "$pattern"; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Sphinx docs
    needs: changes
    # always(): on a push the changes job is skipped and the build still runs
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.docs == 'true')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs,full]"

      - name: Build HTML
        run: |
          sphinx-build -b html -W --keep-going docs/source docs/build/html

      - name: Upload built docs artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/html

  deploy:
    name: Deploy to GitHub Pages
    # always(): the skipped changes job would otherwise skip this one too
    if: always() && needs.build.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
