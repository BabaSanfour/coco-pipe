name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  detect:
    name: Detect run flags
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      run_foundation: ${{ steps.flags.outputs.run_foundation }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: flags
        run: |
          message="$(git log -1 --pretty=%B)"
          echo "HEAD commit message:"
          echo "$message"
          if printf '%s' "$message" | grep -qiF '[run-foundation]'; then
            echo "run_foundation=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_foundation=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Tests / ${{ matrix.os }} / py${{ matrix.python-version }}
    needs: quality
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[full,test]"

      - name: Run tests
        run: |
          pytest tests/ --cov=coco_pipe --cov-report=xml --verbose

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: BabaSanfour/coco-pipe

  pytest:
    name: pytest
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the full test matrix to pass
        run: |
          result="${{ needs.test.result }}"
          echo "test matrix result: $result"
          test "$result" = "success"

  foundation:
    name: Heavy foundation tests
    needs: [quality, detect]
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      needs.detect.outputs.run_foundation == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'run-foundation')

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[full,test]"

      - name: Run real checkpoint tests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          COCO_PIPE_RUN_REAL_FOUNDATION: "1"
          COCO_PIPE_RUN_REAL_FOUNDATION_TRAINING: "1"
        run: |
          pytest tests/ -m real_checkpoints -v
