name: Release

on:
  release:
    types: [published]
  push:
    branches: [main]
  # Pull requests run the Package job only, so a packaging mistake is caught
  # before it reaches main. Publishing still needs a published release.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Validate release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "release tag $RELEASE_TAG does not match pyproject.toml version $version (expected v$version)" >&2
            exit 1
          fi
          if [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" != "$(git rev-parse HEAD)" ]]; then
            echo "release tag $RELEASE_TAG does not point to checkout HEAD" >&2
            exit 1
          fi
      - name: Build distribution artifacts
        run: |
          rm -rf dist/
          python -m build
      - name: Validate distribution artifacts
        run: |
          set -euo pipefail
          python -m twine check --strict dist/*
          # PyPI rejects uploads whose metadata holds a direct-URL dependency.
          if unzip -p dist/*.whl '*.dist-info/METADATA' | grep -E '^Requires-Dist:.*@ '; then
            echo "the wheel declares a direct-URL dependency" >&2
            exit 1
          fi
          # Every tracked file of the package must be in both archives. The
          # test suite runs on an editable install, which reads the source
          # tree and cannot see a file the package-data globs leave out.
          git ls-files coco_pipe | sort > "$RUNNER_TEMP/tracked.txt"
          unzip -Z1 dist/*.whl | sort > "$RUNNER_TEMP/wheel.txt"
          tar -tzf dist/*.tar.gz | cut -d/ -f2- | sort > "$RUNNER_TEMP/sdist.txt"
          for archive in wheel sdist; do
            missing="$(comm -23 "$RUNNER_TEMP/tracked.txt" "$RUNNER_TEMP/$archive.txt")"
            if [[ -n "$missing" ]]; then
              echo "tracked files missing from the $archive:" >&2
              echo "$missing" >&2
              exit 1
            fi
          done
      - name: Validate installed wheel
        run: |
          set -euo pipefail
          wheel_test="$RUNNER_TEMP/coco-pipe-wheel-test"
          python -m venv "$wheel_test"
          wheel="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          "$wheel_test/bin/python" -m pip install "$wheel"
          cd "$RUNNER_TEMP"
          "$wheel_test/bin/python" -c "import coco_pipe; print(coco_pipe.__file__)"
          "$wheel_test/bin/python" -m pip check
          # Render a report from the installed wheel: it loads every bundled
          # template, so a template missing from the wheel fails here.
          "$wheel_test/bin/python" - <<'PY'
          import pathlib

          import plotly.graph_objects as go

          import coco_pipe
          from coco_pipe.report import PlotlyElement, Report, Section

          assert "site-packages" in coco_pipe.__file__, coco_pipe.__file__
          section = Section("Smoke test")
          section.add_element(PlotlyElement(go.Figure(go.Scatter(x=[1, 2], y=[3, 4]))))
          report = Report(title="Wheel smoke test")
          report.add_section(section)
          out = pathlib.Path("wheel-smoke-report.html")
          report.save(out)
          assert out.stat().st_size > 0
          print(f"rendered {out.resolve()} ({out.stat().st_size} bytes)")
          PY
      - name: Upload release distributions
        if: github.event_name == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error
  publish:
    name: Publish to PyPI
    needs: package
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/coco-pipe
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-dists
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          print-hash: true
