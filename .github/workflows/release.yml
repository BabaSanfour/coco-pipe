name: Release

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Validate release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "release tag $RELEASE_TAG does not match pyproject.toml version $version (expected v$version)" >&2
            exit 1
          fi
          if [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" != "$(git rev-parse HEAD)" ]]; then
            echo "release tag $RELEASE_TAG does not point to checkout HEAD" >&2
            exit 1
          fi
      - name: Build distribution artifacts
        run: |
          rm -rf dist/
          python -m build
      - name: Validate distribution artifacts
        run: |
          set -euo pipefail
          python -m twine check --strict dist/*
          # PyPI rejects uploads whose metadata holds a direct-URL dependency.
          if unzip -p dist/*.whl '*.dist-info/METADATA' | grep -E '^Requires-Dist:.*@ '; then
            echo "the wheel declares a direct-URL dependency" >&2
            exit 1
          fi
      - name: Validate installed wheel
        run: |
          set -euo pipefail
          wheel_test="$RUNNER_TEMP/coco-pipe-wheel-test"
          python -m venv "$wheel_test"
          wheel="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          "$wheel_test/bin/python" -m pip install "$wheel"
          cd "$RUNNER_TEMP"
          "$wheel_test/bin/python" -c "import coco_pipe; print(coco_pipe.__file__)"
          "$wheel_test/bin/python" -m pip check
      - name: Upload release distributions
        if: github.event_name == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error
  publish:
    name: Publish to PyPI
    needs: package
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/coco-pipe
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dists
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          print-hash: true
