name: Bug Report
description: Report a bug or unexpected behavior in coco-pipe.
title: "[BUG] "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug.

        Please provide enough information for us to reproduce and investigate the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
      placeholder: Describe the issue.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide a minimal reproducible example.
      placeholder: |
        1. Load dataset ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: What actually happened?
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Error Traceback
      description: Paste any relevant error messages or stack traces.
      render: shell

  - type: input
    id: cocopipe_version
    attributes:
      label: coco-pipe Version
      placeholder: 0.0.1

  - type: input
    id: python_version
    attributes:
      label: Python Version
      placeholder: 3.11

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: Ubuntu 24.04 / macOS / Windows

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any additional information that may help.
