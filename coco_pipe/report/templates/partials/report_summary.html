            <div
                class="mb-6 rounded-lg border border-gray-200 bg-white p-4 shadow-sm dark:border-gray-700 dark:bg-gray-900">
                <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
                    <div>
                        <h2 class="text-sm font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">
                            Report Summary
                        </h2>
                        <div class="mt-2 grid grid-cols-2 gap-3 sm:grid-cols-4 lg:grid-cols-6">
                            <div>
                                <div class="text-xs text-gray-500">Sections</div>
                                <div class="font-mono text-lg font-semibold">{{ report_summary.sections }}</div>
                            </div>
                            <div>
                                <div class="text-xs text-gray-500">Warnings</div>
                                <div class="font-mono text-lg font-semibold text-amber-600">{{ report_summary.warnings }}</div>
                            </div>
                            <div>
                                <div class="text-xs text-gray-500">Failures</div>
                                <div class="font-mono text-lg font-semibold text-red-600">{{ report_summary.failures }}</div>
                            </div>
                            <div>
                                <div class="text-xs text-gray-500">Plots</div>
                                <div class="font-mono text-lg font-semibold">{{ report_summary.plot_count }}</div>
                            </div>
                            <div>
                                <div class="text-xs text-gray-500">Tables</div>
                                <div class="font-mono text-lg font-semibold">{{ report_summary.table_count }}</div>
                            </div>
                            <div>
                                <div class="text-xs text-gray-500">Git</div>
                                <div class="truncate font-mono text-sm font-semibold" title="{{ report_summary.git_hash }}">
                                    {{ report_summary.git_hash }}
                                </div>
                            </div>
                        </div>
                    </div>

                            Expand all
                        </button>
                        <button data-collapse-all
                            class="rounded-md border border-gray-200 bg-white px-3 py-2 text-xs font-medium text-gray-600 transition hover:border-brand-300 hover:text-brand-700 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-300">
                            Collapse all
                        </button>
                    </div>
                </div>
            </div>
