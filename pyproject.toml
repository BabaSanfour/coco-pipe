[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coco-pipe"
version = "0.0.1"
description = "A modular framework for scalable biosignal analysis with Machine Learning and Deep Learning"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Hamza Abdelhedi", email = "hamza.abdelhedii@gmail.com" },
]
keywords = [
  "EEG",
  "machine learning",
  "deep learning",
  "neuroscience",
  "bio-data",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "numpy>=2.0.0",
  "pandas",
  "scikit-learn>=1.6",
  # Upper-capped until seaborn ships PR #3820: matplotlib 3.13 removes the
  # deprecated `vert=` that seaborn<=0.13.2 still passes to bxp, which would
  # break seaborn boxplots. Lift this once a fixed seaborn release exists.
  "matplotlib<3.13",
  "seaborn",
  "scipy>=1.11.0",
  "pyyaml",
  "pydantic",
  "hydra-core",
  "requests",
  "openpyxl",
  "joblib",
  "plotly",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov",
  "beautifulsoup4",
]

docs = [
  "sphinx>=7.0",
  "insegel",
  "pydata-sphinx-theme",
  "sphinx-design",
  "sphinx-gallery",
  "sphinx-copybutton",
  "sphinxcontrib-mermaid",
  "sphinx-autoapi",
  "myst-parser",
  "towncrier",
]

dev = [
  "pre-commit",
  "ruff",
  "pytest>=8.0",
  "pytest-cov",
  "beautifulsoup4",
  "towncrier",
  "build",
  "twine",
]

release = [
  "build",
  "twine",
  "towncrier",
]

dask = [
  "dask[array]",
  "dask-ml",
]

neighbor = [
  "umap-learn[plot]",
  "trimap",
  "phate",
  "pacmap",
  "faiss-cpu",
]

parametric-umap = [
  "umap-learn[plot]",
  "tensorflow",
  "keras",
]

ivis = [
  "annoy>=1.17.3",
  "tensorflow",
  "keras",
  "ivis @ git+https://github.com/beringresearch/ivis.git",
]

topology = [
  "torch",
  "skorch",
  "gudhi",
]

torch = [
  "torch",
]

braindecode = [
  "braindecode>=1.5.0,<1.6",
]

hf = [
  "transformers",
  "huggingface-hub",
]

peft = [
  "peft",
  "accelerate",
]

foundation = [
  "torch",
  "skorch",
  "braindecode>=1.4.0,<1.6",
  "transformers",
  "huggingface-hub",
  "peft",
  "accelerate",
]

decoding = [
  "skorch",
]

quant = [
  "bitsandbytes",
]

moabb = [
  "moabb",
  "mne",
]

torcheeg = [
  "torcheeg",
]

dev-gpu = [
  "pytest>=8.0",
  "torch",
  "accelerate",
]

spatiotemporal = [
  "pydmd",
  "meegkit",
]

eeg = [
  "mne>=1.9.0",
  "mne-bids>=0.10.0",
  "meegkit",
]

descriptors = [
  "specparam",
  "antropy",
  "neurokit2",
]

dim-red = [
  "dask[array]",
  "dask-ml",
  "umap-learn[plot]",
  "trimap",
  "phate",
  "pacmap",
  "faiss-cpu",
  "tensorflow",
  "keras",
  "annoy>=1.17.3",
  "ivis @ git+https://github.com/beringresearch/ivis.git",
  "torch",
  "skorch",
  "gudhi",
  "pydmd",
  "meegkit",
]

full = [
  "dask[array]",
  "dask-ml",
  "umap-learn[plot]",
  "trimap",
  "phate",
  "pacmap",
  "faiss-cpu",
  "tensorflow",
  "keras",
  "annoy>=1.17.3",
  "ivis @ git+https://github.com/beringresearch/ivis.git",
  "torch",
  "skorch",
  "gudhi",
  "pydmd",
  "meegkit",
  "mne>=1.9.0",
  "mne-bids>=0.10.0",
  "specparam",
  "antropy",
  "neurokit2",
  "braindecode>=1.4.0,<1.6",
  "transformers",
  "huggingface-hub",
