[project.urls]
Homepage = "https://github.com/BabaSanfour/coco-pipe"
Documentation = "https://babasanfour.github.io/coco-pipe/"
Repository = "https://github.com/BabaSanfour/coco-pipe.git"
Issues = "https://github.com/BabaSanfour/coco-pipe/issues"
Changelog = "https://github.com/BabaSanfour/coco-pipe/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["coco_pipe*"]

[tool.setuptools.package-data]
"coco_pipe.report.templates" = ["*.html"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q -m 'not real_checkpoints'"
testpaths = ["tests"]
markers = [
  "real_checkpoints: heavy tests that download real foundation checkpoints from HuggingFace. Requires HF_TOKEN, accepted gated-model licenses, network access, and COCO_PIPE_RUN_REAL_FOUNDATION=1.",
]
# Treat warnings as errors so a *new* warning in coco-pipe's own code fails CI,
# then explicitly ignore the known, irreducible ones. Two groups:
#   (2) coco-pipe's own *intentional* informative warnings, which tests trigger
#       on purpose (asserted with `pytest.warns` where it adds a contract;
#       ignored here where the trigger is incidental/parametrized), and
#   (1) third-party deprecations/notices we do not control.
filterwarnings = [
  "error",
  # (2) coco-pipe intentional informative warnings -------------------------
  "ignore:.*is not group-aware.*:UserWarning",
  "ignore:.*uses channel names for positional encoding.*:UserWarning",
  "ignore:.*Variable epoch lengths detected.*:RuntimeWarning",
  "ignore:.*references three external CDN scripts.*:UserWarning",
  # (1) third-party noise --------------------------------------------------
  "ignore:.*groups parameter is ignored.*:UserWarning",
  "ignore:.*enable_nested_tensor.*:UserWarning",
  "ignore:.*torch.jit.script_method.*is deprecated.*:DeprecationWarning",
  "ignore:.*default value of .init. will change.*:FutureWarning",
  "ignore:.*number of connected components.*:UserWarning",
  "ignore:.*Graph is not fully connected.*:UserWarning",
  "ignore:.*Changing the sparsity structure.*",
  "ignore:.*DaskPCA on numpy raised.*:UserWarning",
  "ignore:.*Precision loss occurred in moment calculation.*:RuntimeWarning",
  "ignore:.*invalid value encountered in divide.*:RuntimeWarning",
  "ignore:.*vert.*Use orientation.*",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
  "coco_pipe/decoding/fm_hub/cbramod_src",
  "analysis/analysis_paper_eegbci_109.py",
  "docs/source/auto_examples",
  "docs/build",
  "__pyrefly__virtual*"
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "UP",
  "B",
  "SIM",
  "C4",
  "PIE",
  "RET",
  "RUF",
]
ignore = [
  "RET504",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.towncrier]
package = "coco_pipe"
filename = "CHANGELOG.md"
directory = "changelog.d"
title_format = "## coco-pipe {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/BabaSanfour/coco-pipe/issues/{issue})"

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneous"
showcontent = true
